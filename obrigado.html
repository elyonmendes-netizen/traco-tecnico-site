<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido enviado — Traço Técnico</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' fill='%231336F0'/%3E%3Crect x='3' y='3' width='30' height='30' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M9 27V9h18' fill='none' stroke='%23FFD21F' stroke-width='3.5'/%3E%3Cpath d='M14 27h13V14' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background-color:#1336F0;background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);background-size:40px 40px;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0A1024}
.card{max-width:620px;width:100%;background:#FFFFFF;border:3px solid #0A1024;box-shadow:12px 12px 0 #0A1024;padding:44px 36px;display:flex;flex-direction:column;gap:22px}
.tag{align-self:flex-start;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:.08em;background:#FFD21F;padding:6px 12px;border:2px solid #0A1024}
h1{margin:0;font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(34px,6vw,52px);line-height:1;letter-spacing:-.03em}
p{margin:0;font-size:18px;line-height:1.55;color:#36405A}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:12px 24px;font-weight:700;font-size:17px;text-decoration:none;border:3px solid #0A1024;box-shadow:5px 5px 0 #0A1024;color:#0A1024}
.btn.y{background:#FFD21F}
.btn.w{background:#FFFFFF}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #0A1024}
</style>
</head>
<body>
<main class="card">
<span class="tag">PEDIDO ENVIADO ✓</span>
<h1>Recebi seu pedido de orçamento!</h1>
<p>Obrigado pelo contato. Vou analisar as informações e os anexos e respondo com prazo e valor pelo e-mail ou WhatsApp que você informou.</p>
<p>Enquanto isso, acompanhe dicas e projetos no Instagram.</p>
<div class="actions">
<a class="btn y" href="https://instagram.com/tracotecnico.cad" target="_blank" rel="noopener">Seguir @tracotecnico.cad</a>
<a class="btn w" href="/">Voltar ao site</a>
</div>
</main>
</body>
</html>
